<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Links e recursos da 15ª Região Demolay.">
  <title>15ª Região</title>
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link href="https://fonts.googleapis.com/css?family=Montserrat|Staatliches&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div id="arvore">

    <div id="logo">
      <img id="logo-img" draggable="false" src="imgs/logo.png" alt="">
      <br>
      <p><b id="handle"></b></p>
    </div>

    <main>
      <section id="opcoes">

        <div class="slider-container" id="slider-container" style="display:none;">
          <div class="slider" id="slider"></div>
          <button class="slider-prev" onclick="prevSlide()">&#10094;</button>
          <button class="slider-next" onclick="nextSlide()">&#10095;</button>
        </div>

        <div id="imageModal" onclick="closeModal()"
          style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:1000; justify-content:center; align-items:center; cursor:zoom-out;">
          <img id="modalImage" style="max-width:90vw; max-height:90vh; border-radius:8px;">
        </div>

        <div id="loading">
          <div class="spinner"></div>
          <p>Carregando links...</p>
        </div>

        <div id="erro" style="display:none;">
          <p>&#9888;&#65039; N&atilde;o foi poss&iacute;vel carregar os links. Tente novamente mais tarde.</p>
        </div>

        <ul id="lista"></ul>

        <div class="icon-bar">
          <a id="link-facebook" href="#" target="_blank" class="facebook" aria-label="Facebook" style="display:none;">
            <i class="fa fa-facebook"></i>
          </a>
          <a id="link-instagram" href="#" target="_blank" class="instagram" aria-label="Instagram"
            style="display:none;">
            <i class="fa fa-instagram"></i>
          </a>
        </div>

      </section>
    </main>

  </div>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>

</html>
